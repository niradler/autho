name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64-baseline
            artifact: autho-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            artifact: autho-linux-arm64
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: autho-darwin-arm64
          - os: macos-latest
            target: bun-darwin-x64-baseline
            artifact: autho-darwin-x64
            # The runner is arm64; pull the x64 native TUI library too.
            install_args: --cpu=*
          - os: windows-latest
            target: bun-windows-x64
            artifact: autho-windows-x64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile ${{ matrix.install_args }}

      - name: Build web UI
        run: bun run build:ui

      - name: Build binary
        run: bun build ./apps/cli/src/index.ts --compile --minify --no-compile-autoload-dotenv --no-compile-autoload-bunfig --target=${{ matrix.target }} --outfile=dist/${{ matrix.artifact }}

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x dist/${{ matrix.artifact }}
          dist/${{ matrix.artifact }} help

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: dist/${{ matrix.artifact }} help

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  docker:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Skip without Docker Hub credentials
        id: creds
        run: echo "ok=${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.creds.outputs.ok == 'true'

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: steps.creds.outputs.ok == 'true'
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - id: meta
        if: steps.creds.outputs.ok == 'true'
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/autho
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # The image is built from source in the Dockerfile; .dockerignore keeps vaults and env files out.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        if: steps.creds.outputs.ok == 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum autho-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            dist/autho-*
            dist/checksums.txt
